[workspace]
members = [
    "programs/*",
    "keeper",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.89.0"

# Every crate's dependency versions, in one place. A crate names what it uses with
# `<name>.workspace = true` (and may add features there).
[workspace.dependencies]
# The programs
anchor-lang = "1.1.2"
anchor-spl = "1.1.2"
bytemuck = "1.21"
phoenix-rise-ix = { version = "=0.6.12", features = ["solana"] }
solana-sha256-hasher = "3.1"
# The multi-strategy vault, as its keeper uses it
vanna_phoenix_multi_vault = { path = "programs/vanna_phoenix-multi" }
# The keeper bot
anyhow = "1"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls-webpki-roots"] }
serde = { version = "1", features = ["derive"] }
toml = "0.9"
solana-account-decoder-client-types = "4.2.2"
solana-address-lookup-table-interface = { version = "3.1", features = ["bytemuck"] }
solana-commitment-config = "3.1"
solana-message = "4.4"
solana-rpc-client = "4.2.2"
solana-rpc-client-api = "4.2.2"
solana-transaction = "4.1"
# Shared by the tests and the keeper
base64 = "0.22"
serde_json = "1"
solana-account = "4.3"
solana-compute-budget-interface = "3.0"
solana-keypair = "3.1"
solana-signer = "3.0"
# The tests: Phoenix's own LiteSVM fixture, with the real Phoenix, Ember and Hawkeye programs
litesvm = "=0.16.0"
phoenix-rise-litesvm-test = "=0.6.12"

# The programs' lints (`[lints] workspace = true`).
[workspace.lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(target_os, values("solana"))'] }

[profile.release]
overflow-checks = true
lto = "fat"
codegen-units = 1
[profile.release.build-override]
opt-level = 3
incremental = false
codegen-units = 1
