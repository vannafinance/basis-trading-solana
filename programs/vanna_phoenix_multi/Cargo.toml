[package]
name = "vanna_phoenix_multi_vault"
description = "Vanna multi-strategy basis vault on Solana: one USDC vault whose keeper spreads it over hedged Phoenix perp markets by funding and open interest"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
autotests = false

[lib]
crate-type = ["cdylib", "lib"]
name = "vanna_phoenix_multi_vault"

[features]
default = []
cpi = ["no-entrypoint"]
no-entrypoint = []
no-log-ix-name = []
idl-build = ["anchor-lang/idl-build", "anchor-spl/idl-build"]
anchor-debug = []
custom-heap = []
custom-panic = []

[dependencies]
anchor-lang.workspace = true
anchor-spl.workspace = true
bytemuck.workspace = true
phoenix-rise-ix.workspace = true
solana-sha256-hasher.workspace = true

[dev-dependencies]
base64.workspace = true
litesvm.workspace = true
phoenix-rise-litesvm-test.workspace = true
serde_json.workspace = true
solana-account.workspace = true
solana-compute-budget-interface.workspace = true
solana-keypair.workspace = true
solana-signer.workspace = true

[[test]]
name = "vanna_phoenix_multi_vault"
path = "tests/main.rs"

[lints]
workspace = true
