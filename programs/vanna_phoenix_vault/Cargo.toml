[package]
name = "vanna_phoenix_vault"
version = "0.1.0"
description = "Vanna basis vaults on Solana hedged on Phoenix perpetuals: one share vault per asset (SOL, ETH, BTC, TSLA, META)"
edition.workspace = true
rust-version.workspace = true
autotests = false

[lib]
crate-type = ["cdylib", "lib"]
name = "vanna_phoenix_vault"

[features]
default = []
cpi = ["no-entrypoint"]
no-entrypoint = []
no-log-ix-name = []
idl-build = ["anchor-lang/idl-build", "anchor-spl/idl-build"]
anchor-debug = []
custom-heap = []
custom-panic = []

[dependencies]
anchor-lang = "1.1.2"
anchor-spl = { version = "1.1.2" }
bytemuck = "1.21"
phoenix-rise-ix = { version = "=0.6.12", features = ["solana"] }

[dev-dependencies]
base64 = "0.22"
litesvm = "=0.16.0"
phoenix-rise-litesvm-test = "=0.6.12"
serde_json = "1"
solana-account = "4.3"
solana-compute-budget-interface = "3.0"
solana-keypair = "3.1"
solana-signer = "3.0"

[[test]]
name = "vanna_phoenix_vault"
path = "tests/main.rs"

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(target_os, values("solana"))'] }
